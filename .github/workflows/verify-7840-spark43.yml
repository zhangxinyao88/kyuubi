name: Verify Kyuubi #7840 on Spark 4.3

on:
  push:
    branches:
      - codex/verify-7840-spark43

permissions:
  contents: read

env:
  MAVEN_ARGS: -Dmaven.javadoc.skip=true -Drat.skip=true -Dscalastyle.skip=true -Dspotless.check.skip -Dorg.slf4j.simpleLogger.defaultLogLevel=warn -Pjdbc-shaded,gen-policy -Pflink-provided,hive-provided,spark-provided
  KUBERNETES_VERSION: v1.30.0
  MINIKUBE_VERSION: v1.33.1

jobs:
  default:
    name: Kyuubi and Spark Test
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    strategy:
      matrix:
        include:
          - java: 25
            python: '3.11'
            spark: '4.3'
            spark-archive: '-Pscala-2.13'
            exclude-tags: '-Dmaven.plugin.scalatest.exclude.tags=org.scalatest.tags.Slow,org.apache.kyuubi.tags.DeltaTest,org.apache.kyuubi.tags.IcebergTest,org.apache.kyuubi.tags.PaimonTest,org.apache.kyuubi.tags.HudiTest'
            comment: 'normal'
    env:
      SPARK_LOCAL_IP: localhost
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 2bae5750ee4722528c332a16d4d30c0e35d7e415
          persist-credentials: false
      - name: Free up disk space
        run: ./.github/scripts/free_disk_space.sh
      - name: Tune Runner VM
        uses: ./.github/actions/tune-runner-vm
      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Setup Maven
        uses: ./.github/actions/setup-maven
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Resolve engine archive download URLs
        id: engine-archives
        run: ./.github/scripts/resolve-engine-archive-urls.sh spark,hive,flink -Pspark-${{ matrix.spark }} ${{ matrix.spark-archive }}
      - name: Make /opt writable for engine archives
        run: sudo chown "$(id -un)" /opt
      - name: Download Spark
        uses: ./.github/actions/download-archive
        with:
          url: ${{ steps.engine-archives.outputs.spark-url }}
          untar-dir: /opt
      - name: Download Hive
        uses: ./.github/actions/download-archive
        with:
          url: ${{ steps.engine-archives.outputs.hive-url }}
          untar-dir: /opt
      - name: Download Flink
        uses: ./.github/actions/download-archive
        with:
          url: ${{ steps.engine-archives.outputs.flink-url }}
          untar-dir: /opt
      - name: Expose engine homes
        run: ./.github/scripts/expose-engine-homes.sh spark,hive,flink
      - name: Build and test Kyuubi and Spark with maven w/o linters
        timeout-minutes: 180
        run: |
          if [[ "${{ matrix.java }}" == "8" && "${{ matrix.spark }}" == "3.5" && "${{ matrix.spark-archive }}" == "" ]]; then
            export MAVEN_ARGS="${MAVEN_ARGS} -Pcodecov -Dmaven.javadoc.skip=false -Dmaven.scaladoc.skip=false"
          fi
          TEST_MODULES="dev/kyuubi-codecov"
          ./build/mvn clean install -pl ${TEST_MODULES} -am \
          -Pjava-${{ matrix.java }} -Pspark-${{ matrix.spark }} ${{ matrix.spark-archive }} ${{ matrix.exclude-tags }}
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-tests-log-java-${{ matrix.java }}-spark-${{ matrix.spark }}-${{ matrix.comment }}
          path: |
            **/target/unit-tests.log
            **/kyuubi-spark-sql-engine.log*
            **/kyuubi-spark-batch-submit.log*
